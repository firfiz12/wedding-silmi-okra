<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Wedding of Silmi & Okra | 11.10.2026</title>
  <meta name="description" content="Official Wedding Invitation of Silmi Kaffah Almunawar & Muhammad Okra Dinata. Minggu, 11 Oktober 2026. #berhaSILdiOKtober">
  
  <!-- OpenGraph Metadata -->
  <meta property="og:title" content="The Wedding of Silmi & Okra">
  <meta property="og:description" content="These kids are getting married! Minggu, 11 Oktober 2026. Buka undangan digital kami.">
  <meta property="og:image" content="svg_renders/page_1.png">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Patrick+Hand&family=Patrick+Hand+SC&family=Gaegu:wght@400;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Main Viewport Container -->
  <main class="app-viewport" id="appViewport">
    
    <!-- Background Audio -->
    <audio id="bgAudio" loop preload="auto" src="THESE%20KIDS%20ARE%20GETTING%20MARRIED!.mp4"></audio>

    <!-- Floating Music Toggle Button -->
    <button id="musicToggleBtn" class="floating-music-btn" aria-label="Toggle Background Music" title="Play/Pause Music">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </button>

    <!-- Floating Navigation Bar -->
    <nav id="bottomNav" class="floating-bottom-nav">
      <a href="#cover" class="nav-item active" id="nav-cover">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Cover</span>
      </a>
      <a href="#profile" class="nav-item" id="nav-profile">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        <span>Mempelai</span>
      </a>
      <a href="#savedate" class="nav-item" id="nav-savedate">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Waktu</span>
      </a>
      <a href="#location" class="nav-item" id="nav-location">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>Lokasi</span>
      </a>
      <a href="#gift" class="nav-item" id="nav-gift">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V6a2 2 0 10-2 2h2zm0 0H4v13h16V8h-8z"/></svg>
        <span>Gift</span>
      </a>
      <a href="#story" class="nav-item" id="nav-story">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span>Story</span>
      </a>
      <a href="#rsvp" class="nav-item" id="nav-rsvp">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>RSVP</span>
      </a>
    </nav>


    <!-- =================================================================
         PAGE 1: COVER
         ================================================================= -->
    <section id="cover" class="page-section">
      <div class="page-inner">
        <img src="file_svg/1.svg" class="page-svg" alt="Cover: These Kids Are Getting Married">
        
        <!-- Dynamic Guest Name Overlay -->
        <div class="guest-name-overlay" id="guestNameOverlay">
          <div class="guest-name-text" id="guestName">Tamu Undangan</div>
        </div>

        <!-- Open Invitation Hotspot Button -->
        <button id="openInvitationBtn" class="open-invitation-hotspot" aria-label="Open Invitation">
          <span class="hotspot-pulse"></span>
        </button>
      </div>
    </section>


    <!-- =================================================================
         PAGE 2: PROFILE & QURAN VERSE
         ================================================================= -->
    <section id="profile" class="page-section">
      <div class="page-inner">
        <img src="file_svg/2.svg" class="page-svg" alt="Silmi Kaffah Almunawar & Muhammad Okra Dinata">
      </div>
    </section>


    <!-- =================================================================
         PAGE 3: SAVE THE DATE & COUNTDOWN
         ================================================================= -->
    <section id="savedate" class="page-section">
      <div class="page-inner">
        <img src="file_svg/3.svg" class="page-svg" alt="Save The Date 11.10.26">

        <!-- Live Countdown Numbers Overlay -->
        <div class="countdown-overlay">
          <div class="cd-box cd-days">
            <span id="countDays" class="cd-num">39</span>
          </div>
          <div class="cd-box cd-hours">
            <span id="countHours" class="cd-num">04</span>
          </div>
          <div class="cd-box cd-mins">
            <span id="countMinutes" class="cd-num">42</span>
          </div>
          <div class="cd-box cd-secs">
            <span id="countSeconds" class="cd-num">14</span>
          </div>
        </div>

        <!-- Google Calendar Action Button -->
        <button id="btnAddToCalendar" class="btn-cal-action" title="Simpan tanggal ke Google Calendar">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
          <span>Simpan di Google Calendar</span>
        </button>
      </div>
    </section>


    <!-- =================================================================
         PAGE 4: LOCATION
         ================================================================= -->
    <section id="location" class="page-section">
      <div class="page-inner">
        <img src="file_svg/4.svg" class="page-svg" alt="Location: Kampung Makan Joglo">

        <!-- See Location Hotspot Link -->
        <a href="https://maps.google.com/?q=Kampung+Makan+Joglo+Jakarta+Barat" target="_blank" rel="noopener" class="see-location-hotspot" title="Buka di Google Maps" aria-label="See Location Google Maps">
          <span class="hotspot-pulse"></span>
        </a>
      </div>
    </section>


    <!-- =================================================================
         PAGE 5: WEDDING GIFT
         ================================================================= -->
    <section id="gift" class="page-section">
      <div class="page-inner">
        <img src="file_svg/5.svg" class="page-svg" alt="Wedding Gift BCA & Mandiri">

        <!-- Copy BCA Button Hotspot -->
        <button class="copy-hotspot copy-bca" data-bank="BCA" data-account="11223344" title="Salin No. Rekening BCA" aria-label="Salin No. Rekening BCA">
          <span class="hotspot-pulse-sm"></span>
        </button>

        <!-- Copy Mandiri Button Hotspot -->
        <button class="copy-hotspot copy-mandiri" data-bank="Mandiri" data-account="11223344" title="Salin No. Rekening Mandiri" aria-label="Salin No. Rekening Mandiri">
          <span class="hotspot-pulse-sm"></span>
        </button>

        <!-- WhatsApp Gift Confirmation Hotspot -->
        <a href="https://wa.me/6281234567890?text=Halo%20Silmi%20%26%20Okra,%20saya%20ingin%20konfirmasi%20pengiriman%20kado%20pernikahan" target="_blank" rel="noopener" class="wa-hotspot" title="Konfirmasi Kado via WhatsApp" aria-label="Konfirmasi WhatsApp">
          <span class="hotspot-pulse"></span>
        </a>
      </div>
    </section>


    <!-- =================================================================
         PAGE 6: LOVE STORY
         ================================================================= -->
    <section id="story" class="page-section">
      <div class="page-inner">
        <img src="file_svg/6.svg" class="page-svg" alt="Love Story: Takdir, Sebuah Luka, Saling Dipersiapkan, Bismillah">
      </div>
    </section>


    <!-- =================================================================
         PAGE 7: RSVP & LIVE WISHES
         ================================================================= -->
    <section id="rsvp" class="page-section">
      <div class="page-inner">
        <img src="file_svg/7.svg" class="page-svg" alt="RSVP Silmi & Okra">

        <!-- Interactive RSVP Form Overlay -->
        <form id="rsvpForm" class="rsvp-form-overlay">
          <!-- Name Input -->
          <input type="text" id="rsvpName" class="rsvp-input-name" placeholder="Nama Anda" required autocomplete="name">
          
          <!-- Message Input -->
          <textarea id="rsvpMessage" class="rsvp-input-msg" placeholder="Tuliskan ucapan dan doa restu..." required rows="3"></textarea>
          
          <!-- Attendance Choices -->
          <button type="button" class="rsvp-choice-hotspot choice-hadir active" data-status="Hadir" aria-label="Absolutely, wouldn't miss it!"></button>
          <button type="button" class="rsvp-choice-hotspot choice-tidak" data-status="Berhalangan" aria-label="Can't make it this time."></button>
          
          <!-- Submit Button Hotspot -->
          <button type="submit" class="rsvp-submit-hotspot" aria-label="RSVP Now">
            <span class="hotspot-pulse"></span>
          </button>
        </form>
      </div>

      <!-- Live Wishes Board (Placed immediately below the RSVP Card) -->
      <div class="wishes-container">
        <h3 class="wishes-title">
          <span>💌 Doa &amp; Ucapan Hangat</span>
        </h3>
        <div id="wishesList" class="wishes-list">
          <!-- Dynamically populated by app.js -->
        </div>
      </div>
    </section>


    <!-- =================================================================
         PAGE 8: CLOSING SECTION
         ================================================================= -->
    <section id="closing" class="page-section">
      <div class="page-inner">
        <img src="file_svg/8.svg" class="page-svg" alt="See You at Our Wedding Day 11.10.26 #berhaSILdiOKtober">

        <!-- Hashtag Hotspot Link -->
        <a href="https://instagram.com/explore/tags/berhaSILdiOKtober/" target="_blank" rel="noopener" class="hashtag-hotspot" title="Lihat #berhaSILdiOKtober di Instagram" aria-label="Hashtag Instagram"></a>
      </div>
    </section>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
