<body>

  <main class="app-viewport" id="appViewport">

    <!-- Floating Music Toggle Button -->

    <!-- Floating Navigation Bar -->
    <nav id="bottomNav" class="floating-bottom-nav">
      <a href="#cover" class="nav-item active" id="nav-cover">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />

      </a>
      <a href="#profile" class="nav-item" id="nav-profile">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        </svg>
        <span>Mempelai</span>
      </a>
      <a href="#savedate" class="nav-item" id="nav-savedate">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span>Waktu</span>
      </a>
      <a href="#location" class="nav-item" id="nav-location">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Lokasi</span>
      </a>
      <a href="#gift" class="nav-item" id="nav-gift">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V6a2 2 0 10-2 2h2zm0 0H4v13h16V8h-8z" />
        </svg>
        <span>Gift</span>
      </a>
      <a href="#story" class="nav-item" id="nav-story">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        <span>Story</span>
      </a>
      <a href="#rsvp" class="nav-item" id="nav-rsvp">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>RSVP</span>
      </a>
      <a href="#closing" class="nav-item" id="nav-closing">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        </svg>
        <span>Penutup</span>
      </a>
    </nav>


    <!-- =================================================================
         PAGE 1: COVER
         ================================================================= -->
    <section id="cover" class="page-section page-active">
      <div class="page-inner">
        <img src="file_svg/1.svg" class="page-svg" alt="Cover: These Kids Are Getting Married">

        <!-- Animated Sparkling Stars Overlay on Cover -->
        <div class="anim-sparkle anim-sparkle-1">✨</div>
        <div class="anim-sparkle anim-sparkle-2">✨</div>
        <div class="anim-sparkle anim-sparkle-3">✨</div>
        <div class="anim-sparkle anim-sparkle-4">✨</div>

        <!-- Animated Fluttering Ribbon Bow Effect (top-left) -->
        <div class="anim-ribbon-sway"></div>

        <!-- Animated Wedding Rings Glow (top-right) -->
        <div class="anim-rings-sparkle"></div>

        <!-- Dynamic Guest Name Overlay -->
        <div class="guest-name-overlay" id="guestNameOverlay">
          <div class="guest-name-text" id="guestName">Tamu Undangan</div>
        </div>

        <!-- Open Invitation Hotspot Button with Pulsing Wave -->
        <button id="openInvitationBtn" class="open-invitation-hotspot" aria-label="Open Invitation">
          <span class="hotspot-pulse"></span>
          <span class="hotspot-shimmer"></span>
        </button>
      </div>
    </section>


    <!-- =================================================================
         PAGE 2: PROFILE & QURAN VERSE
         ================================================================= -->
    <section id="profile" class="page-section">
      <div class="page-inner">
        <img src="file_svg/2.svg" class="page-svg" alt="Silmi Kaffah Almunawar & Muhammad Okra Dinata">

        <!-- Animated Gliding Merpati Doves -->
        <div class="anim-dove anim-dove-left"></div>
        <div class="anim-dove anim-dove-right"></div>

        <!-- Animated Red String Heartbeat Pulse -->
        <div class="anim-heart-pulse"></div>

        <!-- Sparkles -->
        <div class="anim-sparkle anim-sparkle-p1">✨</div>
        <div class="anim-sparkle anim-sparkle-p2">✨</div>
      </div>
    </section>


    <!-- =================================================================
         PAGE 3: SAVE THE DATE & COUNTDOWN
         ================================================================= -->
    <section id="savedate" class="page-section">
      <div class="page-inner">
        <img src="file_svg/3.svg" class="page-svg" alt="Save The Date 11.10.26">

        <!-- Animated Swinging Disco Ball (Pendulum physics) -->
        <div class="anim-discoball-swing" title="Swinging Disco Ball">
          <svg viewBox="0 0 100 140" fill="none" stroke="#8B1A1A" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="50" y1="0" x2="50" y2="28" />
            <circle cx="50" cy="28" r="4" fill="#8B1A1A" />
            <path d="M47 28 C34 17, 22 25, 30 35 C37 40, 46 30, 47 28" />
            <path d="M53 28 C66 17, 78 25, 70 35 C63 40, 54 30, 53 28" />
            <circle cx="50" cy="85" r="42" />
            <ellipse cx="50" cy="85" rx="42" ry="14" />
            <ellipse cx="50" cy="85" rx="42" ry="28" />
            <ellipse cx="50" cy="85" rx="14" ry="42" />
            <ellipse cx="50" cy="85" rx="28" ry="42" />
          </svg>
          <div class="discoball-glint"></div>
        </div>

        <!-- Animated Clinking Cheers Couple on Cake -->
        <div class="anim-cake-cheers">
          <div class="cheers-glint">✨</div>
        </div>

        <!-- Live Countdown Numbers Overlay -->
        <div class="countdown-overlay">
          <div class="cd-box cd-days">
            <span id="countDays" class="cd-num">39</span>
          </div>
          <div class="cd-box cd-hours">
            <span id="countHours" class="cd-num">04</span>
          </div>
          <div class="cd-box cd-mins">
            <span id="countMinutes" class="cd-num">42</span>
          </div>
          <div class="cd-box cd-secs">
            <span id="countSeconds" class="cd-num">14</span>
          </div>
        </div>

        <!-- Google Calendar Action Button -->
        <button id="btnAddToCalendar" class="btn-cal-action" title="Simpan tanggal ke Google Calendar">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z" />
          </svg>
          <span>Simpan di Google Calendar</span>
        </button>
      </div>
    </section>


    <!-- =================================================================
         PAGE 4: LOCATION
         ================================================================= -->
    <section id="location" class="page-section">
      <div class="page-inner">
        <img src="file_svg/4.svg" class="page-svg" alt="Location: Kampung Makan Joglo">

        <!-- Animated Flying Birds across the Sky -->
        <div class="anim-birds-flight">
          <span class="flying-bird bird-1">🕊️</span>
          <span class="flying-bird bird-2">🕊️</span>
          <span class="flying-bird bird-3">🕊️</span>
        </div>

        <!-- See Location Hotspot Link -->
        <a href="https://maps.google.com/?q=Kampung+Makan+Joglo+Jakarta+Barat" target="_blank" rel="noopener"
          class="see-location-hotspot" title="Buka di Google Maps" aria-label="See Location Google Maps">
          <span class="hotspot-pulse"></span>
        </a>
      </div>
    </section>


    <!-- =================================================================
         PAGE 5: WEDDING GIFT
         ================================================================= -->
    <section id="gift" class="page-section">
      <div class="page-inner">
        <img src="svg_renders/page_5.png" class="page-svg" alt="Wedding Gift BCA & BSI">

        <!-- Animated Swaying Bouquet & Jiggling Gift Boxes -->
        <div class="anim-bouquet-sway"></div>
        <div class="anim-giftbox-jiggle"></div>

        <!-- Copy BCA Button Hotspot -->
        <button class="copy-hotspot copy-bca" data-bank="BCA" data-account="4190221046" data-name="Muhammad Okra Dinata"
          title="Salin No. Rekening BCA (4190221046 a.n. Muhammad Okra Dinata)" aria-label="Salin No. Rekening BCA">
          <span class="hotspot-pulse-sm"></span>
        </button>

        <!-- Copy BSI Button Hotspot -->
        <button class="copy-hotspot copy-bsi" data-bank="BSI" data-account="7185383247" data-name="Silmi Kaffah"
          title="Salin No. Rekening BSI (7185383247 a.n. Silmi Kaffah)" aria-label="Salin No. Rekening BSI">
          <span class="hotspot-pulse-sm"></span>
        </button>

        <!-- WhatsApp Gift Confirmation Hotspot -->
        <a href="https://wa.me/6282333840722?text=Halo%20Silmi%20%26%20Okra,%20saya%20ingin%20konfirmasi%20pengiriman%20kado%20pernikahan"
          target="_blank" rel="noopener" class="wa-hotspot" title="Konfirmasi Kado via WhatsApp"
          aria-label="Konfirmasi WhatsApp">
          <span class="hotspot-pulse"></span>
        </a>
      </div>
    </section>


    <!-- =================================================================
         PAGE 6: LOVE STORY
         ================================================================= -->
    <section id="story" class="page-section">
      <div class="page-inner">
        <img src="file_svg/6.svg" class="page-svg"
          alt="Love Story: Takdir, Sebuah Luka, Saling Dipersiapkan, Bismillah">

        <!-- Animated Swaying Chandelier -->
        <div class="anim-chandelier-sway"></div>

        <!-- Animated Dangling Hearts -->
        <div class="anim-hearts-dangle"></div>
      </div>
    </section>


    <!-- =================================================================
         PAGE 7: RSVP & LIVE WISHES (REFINED & PRECISE)
         ================================================================= -->
    <section id="rsvp" class="page-section rsvp-refined-section">

      <!-- RSVP Title at Top (matches Canva typography) -->
      <h2 class="rsvp-refined-title">RSVP</h2>

      <!-- Crisp, Native, Pixel-Perfect RSVP Card -->
      <div class="rsvp-refined-card">
        <h3 class="rsvp-card-heading">RSVP</h3>

        <form id="rsvpForm">
          <!-- Your Name -->
          <div class="rsvp-field-group">
            <label for="rsvpName" class="rsvp-field-label">Your name</label>
            <input type="text" id="rsvpName" class="rsvp-text-input" placeholder="Tuliskan nama lengkap Anda" required
              autocomplete="name">
          </div>

          <!-- Drop a Message -->
          <div class="rsvp-field-group">
            <label for="rsvpMessage" class="rsvp-field-label">Drop a message</label>
            <textarea id="rsvpMessage" class="rsvp-textarea-input" placeholder="Tuliskan doa restu & ucapan manis..."
              required rows="3"></textarea>
          </div>

          <!-- Are you coming? Choices -->
          <div class="rsvp-field-group">
            <label class="rsvp-field-label">Are you coming?</label>
            <div class="rsvp-pills-wrap">
              <div class="rsvp-pill active" data-status="Hadir" id="pillHadir">
                <span class="pill-radio-dot"></span>
                <span class="pill-text">Absolutely, wouldn't miss it!</span>
              </div>
              <div class="rsvp-pill" data-status="Berhalangan" id="pillTidak">
                <span class="pill-radio-dot"></span>
                <span class="pill-text">Can't make it this time.</span>
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-rsvp-submit" id="btnRsvpSubmit">
            <span>RSVP now</span>
            <span class="btn-submit-sparkle">✨</span>
          </button>

          <!-- Disclaimer -->
          <p class="rsvp-disclaimer-note">
            Nama Anda akan ditampilkan pada papan doa dan ucapan di bawah ini.
          </p>
        </form>
      </div>

      <!-- Live Wishes Board -->
      <div class="wishes-container">
        <h3 class="wishes-title">
          <span>💌 Doa &amp; Ucapan Hangat</span>
        </h3>
        <div id="wishesList" class="wishes-list">
          <!-- Dynamically populated by app.js -->
        </div>
      </div>
    </section>


    <!-- =================================================================
         PAGE 8: CLOSING SECTION
         ================================================================= -->
    <section id="closing" class="page-section">
      <div class="page-inner">
        <img src="file_svg/8.svg" class="page-svg" alt="See You at Our Wedding Day 11.10.26 #berhaSILdiOKtober">

        <!-- Animated Oval Ribbon Sway -->
        <div class="anim-closing-sway"></div>

        <!-- Hashtag Hotspot Link -->
        <a href="https://instagram.com/explore/tags/berhaSILdiOKtober/" target="_blank" rel="noopener"
          class="hashtag-hotspot" title="Lihat #berhaSILdiOKtober di Instagram" aria-label="Hashtag Instagram">
          <span class="hashtag-shimmer"></span>
        </a>
      </div>
    </section>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- JavaScript -->
  <script src="js/app.js"></script>
</body>
